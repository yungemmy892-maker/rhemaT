name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint, format, test, build-check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      MONGO_URI: mongodb://localhost:27017/verseid_ci
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Check formatting (Black)
        run: black --check --diff .

      - name: Django system check
        run: python manage.py check

      - name: Check for pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-logs-${{ github.run_id }}
          path: backend/*.log
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Redeploy Backend on Pxxl
    needs: test

    if: github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Install Pxxl CLI
        run: npm install -g @pxxlapp/pxxl

      - name: Verify Pxxl authentication
        env:
          PXXL_API_KEY: ${{ secrets.PXXLAPIKEY }}
        run: pxxl whoami

      - name: Redeploy backend
        env:
          PXXL_API_KEY: ${{ secrets.PXXLAPIKEY }}
        run: pxxl redeploy "${{ secrets.PXXLPROJECTID }}"