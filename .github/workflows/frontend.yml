# Frontend CI/CD — Vite + React (TanStack Start) app in frontend/.
#
# Pull requests: install, lint, format-check, build. Push to main: the
# same, then deploy to Vercel if — and only if — all of that passed.
name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend
    shell: bash

jobs:
  build:
    name: Lint, format, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint | tee eslint.log

      - name: Formatting check (Prettier)
        run: bunx prettier --check . | tee prettier.log

      - name: Build (Vite)
        run: bun run build | tee build.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-logs-${{ github.run_id }}
          path: frontend/*.log
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build via Vercel
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          NITRO_PRESET: vercel
          VERCEL_FORCE_NO_BUILD_CACHE: 1

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"